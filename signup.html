<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Daniels Car Accessories</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🚗</div>
        Daniels <span style="color:var(--accent)">Car</span> Accessories
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <div class="auth-area"></div>
        <a href="cart.html" class="cart-btn">🛒 <span class="cart-count" style="display:none">0</span></a>
        <button class="mobile-menu-btn">☰</button>
      </div>
    </div>
  </header>

  <div class="mobile-nav">
    <button class="close-mobile">✕</button>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Sign Up</a>
  </div>

  <section class="auth-section">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join Daniels Car Accessories today</p>
      </div>

      <div id="auth-message" class="auth-message" style="display:none;"></div>

      <form id="signup-form" class="auth-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Repeat your password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 Daniels Car Accessories. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/js/products.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (getCurrentUser()) {
      window.location.href = 'index.html';
    }

    const returnTo = getReturnTo();
    document.querySelector('.auth-footer a')?.setAttribute('href', getAuthUrl('login'));

    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const messageEl = document.getElementById('auth-message');

      if (password !== confirm) {
        messageEl.style.display = 'block';
        messageEl.textContent = 'Passwords do not match';
        messageEl.className = 'auth-message error';
        return;
      }

      const result = signup(name, email, password);

      messageEl.style.display = 'block';
      messageEl.textContent = result.message;
      messageEl.className = 'auth-message ' + (result.success ? 'success' : 'error');

      if (result.success) {
        setTimeout(() => {
          window.location.href = returnTo;
        }, 1200);
      }
    });
  </script>
</body>
</html>
